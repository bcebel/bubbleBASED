<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            font-family: monospace;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="status">Waiting for camera...</div>
    <video id="preview" autoplay playsinline muted></video>

    <script>
        let mediaRecorder;
        let chunkIndex = 0;
        let localStream;

        // 1. Start the camera
        async function startRecording() {
            try {
                document.getElementById("status").innerText = "Requesting camera...";

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, frameRate: 30 },
                    audio: false
                });

                document.getElementById("preview").srcObject = localStream;
                document.getElementById("status").innerText = "Camera Active. Recording...";

                // 2. Set up the recorder (WebM preferred)
                const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
                    ? 'video/webm;codecs=vp8,opus'
                    : 'video/mp4';

                mediaRecorder = new MediaRecorder(localStream, { mimeType });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        const reader = new FileReader();
                        reader.readAsDataURL(e.data);
                        reader.onloadend = () => {
                            const base64data = reader.result.split(',')[1];
                            const index = chunkIndex === 0 ? -1 : chunkIndex - 1;

                            if (window.ReactNativeWebView) {
                                window.ReactNativeWebView.postMessage(JSON.stringify({
                                    type: "CHUNK",
                                    index: index,
                                    base64: base64data,
                                    mimeType: mimeType
                                }));
                            }
                            chunkIndex++;
                        };
                    }
                };

                mediaRecorder.start(4000); // 4 second chunks
            } catch (err) {
                document.getElementById("status").innerText = "Error: " + err.message;
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({ type: "ERROR", message: err.message }));
                }
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            document.getElementById("status").innerText = "Stopped.";
        }

        // Listen for messages from React Native
        document.addEventListener("message", (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === "start") startRecording();
                if (data.action === "stop") stopRecording();
            } catch (e) { }
        });

        window.addEventListener("message", (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === "start") startRecording();
                if (data.action === "stop") stopRecording();
            } catch (e) { }
        });
    </script>
</body>

</html>
