<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            font-family: monospace;
            z-index: 10;
        }
    </style>
    <script type="module">
        import WebTorrent from 'https://ebubbl.com/webtorrent.min.js';
        window.WebTorrent = WebTorrent;
    </script>
</head>

<body>
    <div id="status">Waiting for camera...</div>
    <video id="preview" autoplay playsinline muted></video>

    <script>
        let mediaRecorder;
        let chunkIndex = 0;
        let localStream;
        let torrentClient;
        let currentSessionId;

        function initTorrent() {
            if (!torrentClient) {
                torrentClient = new window.WebTorrent();
            }
            return torrentClient;
        }

        async function startRecording(sessionId) {
            console.log("🎥 HTML Recorder: Received start command");
            if (sessionId) {
                currentSessionId = sessionId;
            }
            console.log("🎥 HTML Recorder: Starting for session:", currentSessionId);
            try {
                if (!window.WebTorrent) {
                    document.getElementById("status").innerText = "Loading WebTorrent...";
                    await new Promise((resolve) => {
                        const check = setInterval(() => {
                            if (window.WebTorrent) {
                                clearInterval(check);
                                resolve();
                            }
                        }, 100);
                    });
                }

                document.getElementById("status").innerText = "Requesting camera...";

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 360 },
                    audio: true
                });

                const preview = document.getElementById("preview");
                preview.srcObject = localStream;

                try {
                    await preview.play();
                    console.log("🎥 Preview is playing");
                } catch (playErr) {
                    console.warn("Play error:", playErr);
                }

                document.getElementById("status").innerText = "Camera Active. Recording...";

                // Note: Removed spaces inside codec string to prevent MediaRecorder parsing exceptions on Android
                const mimeType = 'video/mp4; codecs="mp4a.40.2,avc1.42E01E"';
                mediaRecorder = new MediaRecorder(localStream, { mimeType });

          // Inside your HTML recorder onDataAvailable:
                mediaRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        const index = chunkIndex === 0 ? -1 : chunkIndex - 1;

                        // 1. Seed via WebTorrent instantly
                        const client = initTorrent();
                        client.seed(e.data, { name: `chunk-${index}.mp4` }, async (torrent) => {
                            console.log(`Seeded chunk ${index}: ${torrent.magnetURI}`);

                            // 2. Upload the raw Blob to Heroku as a clean multipart file (No base64 corruption!)
                            const formData = new FormData();
                            formData.append('sessionId', sessionIdRef.current);
                            formData.append('chunkIndex', index);
                            formData.append('mimeType', mimeType);
                            formData.append('chunkFile', e.data, `chunk-${index}.mp4`);

                            try {
                                await fetch(`${BACKEND_URL}/api/live-chunk-native`, {
                                    method: 'POST',
                                    body: formData // Express/Multer handles this natively without size limits or base64 bugs
                                });
                            } catch (err) {
                                console.error("Heroku backup upload failed:", err);
                            }

                            // 3. Send the magnet link up via postMessage
                            window.ReactNativeWebView.postMessage(JSON.stringify({
                                type: "CHUNK",
                                index: index,
                                magnetURI: torrent.magnetURI
                            }));
                        });

                        chunkIndex++;
                    }
                };
                mediaRecorder.start(4000);
            } catch (err) {
                document.getElementById("status").innerText = "Error: " + err.message;
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({ type: "ERROR", message: err.message }));
                }
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            document.getElementById("status").innerText = "Stopped.";
        }

        document.addEventListener("message", (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === "start") startRecording();
                if (data.action === "stop") stopRecording();
            } catch (e) { }
        });

        window.addEventListener("message", (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === "start") startRecording();
                if (data.action === "stop") stopRecording();
            } catch (e) { }
        });

        window.startRecording = startRecording;
        window.stopRecording = stopRecording;
    </script>
</body>

</html>
