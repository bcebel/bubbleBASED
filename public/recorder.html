<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            font-family: monospace;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="status">Waiting for camera...</div>
    <video id="preview" autoplay playsinline muted></video>

<script>
    let mediaRecorder;
    let chunkIndex = 0;
    let localStream;

    async function startRecording() {
        try {
            document.getElementById("status").innerText = "Requesting camera...";

            localStream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, frameRate: 30 },
                audio: false
            });

            document.getElementById("preview").srcObject = localStream;
            document.getElementById("status").innerText = "Camera Active. Recording...";

    const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
                ? 'video/mp4; codecs="avc1.42E01E"'
                : 'video/mp4';

            mediaRecorder = new MediaRecorder(localStream, { mimeType });

            // Inside your WebView HTML script:
            mediaRecorder.ondataavailable = async (e) => {
                if (e.data.size > 0) {
                    const reader = new FileReader();
                    reader.readAsDataURL(e.data);
                    reader.onloadend = () => {
                        const base64data = reader.result.split(',')[1];
                          const index = chunkIndex === 0 ? -1 : chunkIndex - 1;

                        window.ReactNativeWebView.postMessage(JSON.stringify({
                            type: "CHUNK",
                            index: index, // Use the actual sequential number
                            base64: base64data,
                            mimeType: mimeType
                        }));

                        chunkIndex++;
                    };
                }
            };

            setTimeout(() => {
                console.log("waiting");
            }, 500);
       // 1. Start recording normally without an automatic timeslice interval
            mediaRecorder.start();

            // 2. Force the recorder to hold onto the first segment 
            // for a solid 2 to 3 seconds so it packs real frames and a complete moov atom into it
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.requestData(); // This flushes out a thick, multi-second chunk -1
                }
            }, 3000); // 3 seconds of buffer time

            // 3. After the fat header is safely captured, start your regular 4-second interval
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    setInterval(() => {
                        if (mediaRecorder && mediaRecorder.state === "recording") {
                            mediaRecorder.requestData(); // This triggers your standard 4-second chunks (0, 1, 2...)
                        }
                    }, 4000);
                }
            }, 3500);

        } catch (err) {
            document.getElementById("status").innerText = "Error: " + err.message;
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type: "ERROR", message: err.message }));
            }
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
        }
        document.getElementById("status").innerText = "Stopped.";
    }

        document.addEventListener("message", (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === "start") startRecording();
                if (data.action === "stop") stopRecording();
            } catch (e) { }
        });

    window.addEventListener("message", (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.action === "start") startRecording();
            if (data.action === "stop") stopRecording();
        } catch (e) { }
    });
</script>
</body>

</html>
