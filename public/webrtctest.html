<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Call</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #eee;
            padding: 20px;
        }

        .video-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        video {
            width: 50vw;
            height: 50vh;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
        }

        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button#hangupBtn {
            background: #ff4444;
            color: #fff;
        }

        button#answerBtn {
            background: #00bbff;
            color: #fff;
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <h1>Call</h1>
    <p id="status">Starting...</p>

    <div class="controls">
        <button id="sendBtn" disabled>Call</button>
        <button id="answerBtn" style="display: none;" disabled>Answer</button>
        <button id="hangupBtn" disabled>Hang Up</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <pre id="log"></pre>

    <script src="https://cdn.jsdelivr.net/npm/p2pt@1.6.2/dist/p2pt.iife.js"></script>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += msg + '\n';
            console.log(msg);
            el.scrollTop = el.scrollHeight;
        }

        const params = new URLSearchParams(window.location.search);
        const trackersAnnounceURLs = ['wss://tracker2-c3c2b7aba721.herokuapp.com/'];
        const identifier = params.get('room') || 'fallback-room-ebubbl-' + Math.random().toString(36).slice(2, 9);
        log('Joined room: ' + identifier);
        const connectedPeers = [];

        let localStream = null;
        let peerConnection = null;
        let pendingOffer = null;
        let ringtoneAudioCtx = null;
        let ringInterval = null;

        // --- RINGTONE FUNCTIONS ---
        function playRingTone() {
            if (ringtoneAudioCtx) return;
            try {
                ringtoneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

                const playTonePattern = () => {
                    if (!ringtoneAudioCtx || ringtoneAudioCtx.state === 'closed') return;

                    [0, 200].forEach(delay => {
                        setTimeout(() => {
                            if (!ringtoneAudioCtx || ringtoneAudioCtx.state === 'closed') return;
                            const osc = ringtoneAudioCtx.createOscillator();
                            const gain = ringtoneAudioCtx.createGain();

                            osc.type = 'sine';
                            osc.frequency.value = 440;

                            gain.gain.setValueAtTime(0.1, ringtoneAudioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, ringtoneAudioCtx.currentTime + 0.15);

                            osc.connect(gain);
                            gain.connect(ringtoneAudioCtx.destination);

                            osc.start();
                            osc.stop(ringtoneAudioCtx.currentTime + 0.15);
                        }, delay);
                    });
                };

                playTonePattern();
                ringInterval = setInterval(playTonePattern, 3000);
            } catch (err) {
                log('Ringtone error: ' + err.message);
            }
        }

        function stopRingTone() {
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
            if (ringtoneAudioCtx) {
                ringtoneAudioCtx.close().catch(() => { });
                ringtoneAudioCtx = null;
            }
        }
        // -------------------------

        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "stun:stun.services.mozilla.com:3478" },
                { urls: "stun:stun.nextcloud.com:443" },
                { urls: "stun:stun.cloudflare.com:3478" },
                { urls: "turn:standard.relay.metered.ca:80", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                { urls: "turn:standard.relay.metered.ca:443", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:global.stun.twilio.com:3478" }
            ]
        };

        async function initCamera() {
            if (localStream) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                log('Camera error: ' + err.message);
            }
        }

        function getOrCreatePC(peer) {
            if (peerConnection) return peerConnection;
            peerConnection = new RTCPeerConnection(rtcConfig);
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('status').textContent = 'Connected!';
                document.getElementById('hangupBtn').disabled = false;
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && peer) {
                    p2pt.send(peer, { type: 'ice', candidate: event.candidate });
                }
            };

            return peerConnection;
        }

        function decodePayload(raw) {
            let text;
            try {
                text = typeof raw === 'string' ? raw : new TextDecoder().decode(raw);
            } catch (e) { log('Decode failed: ' + e.message); return null; }

            const i = text.indexOf('{');
            if (i === -1) { log('No { in payload'); return null; }

            let outer;
            try { outer = JSON.parse(text.substring(i)); }
            catch (e) { log('Outer parse failed: ' + e.message); return null; }

            if (outer && typeof outer.msg === 'string') {
                try { return JSON.parse(outer.msg); }
                catch (e) { log('Inner parse failed: ' + e.message); return null; }
            }

            return outer;
        }

        function hangupCall(notifyPeer = true) {
            stopRingTone(); // Instantly kills the ringer if it's going off!

            if (notifyPeer && connectedPeers.length > 0) {
                connectedPeers.forEach(peer => {
                    try { p2pt.send(peer, { type: 'hangup' }); } catch (e) { }
                });
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('answerBtn').style.display = 'none';
            document.getElementById('answerBtn').disabled = true;
            document.getElementById('hangupBtn').disabled = true;
            document.getElementById('status').textContent = 'Call ended.';
            pendingOffer = null;
            log('Call hung up.');
        }

        const p2pt = new P2PT(trackersAnnounceURLs, identifier);

        p2pt.on('peerconnect', (peer) => {
            document.getElementById('status').textContent = 'Peer connected! Ready to call.';
            document.getElementById('sendBtn').disabled = false;
            connectedPeers.push(peer);

            peer.on('data', async (raw) => {
                const data = decodePayload(raw);
                if (!data) return;

                if (data.type === 'hangup') {
                    log('Remote peer hung up.');
                    hangupCall(false); // This calls hangupCall, which now automatically stops the ringer!
                    return;
                }

                if (data.type === 'offer') {
                    pendingOffer = data.sdp;
                    document.getElementById('status').textContent = 'Incoming call...';
                    document.getElementById('answerBtn').style.display = 'inline-block';
                    document.getElementById('answerBtn').disabled = false;
                    document.getElementById('sendBtn').disabled = true;
                    document.getElementById('hangupBtn').disabled = false; // Let them hit hang up to reject/stop ringing
                    playRingTone();
                    return;
                }

                if (peerConnection) {
                    if (data.type === 'answer' && peerConnection.signalingState === 'have-local-offer') {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                    }
                    else if (data.type === 'ice' && data.candidate) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            });
        });

        // Caller clicks "Call"
        document.getElementById('sendBtn').onclick = async () => {
            if (connectedPeers.length === 0) return;
            await initCamera();

            const peer = connectedPeers[0];
            const pc = getOrCreatePC(peer);
            document.getElementById('status').textContent = 'Calling...';

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                p2pt.send(peer, { type: 'offer', sdp: pc.localDescription.sdp });
                document.getElementById('hangupBtn').disabled = false;
                document.getElementById('sendBtn').disabled = true;
            } catch (err) {
                log('Offer error: ' + err);
            }
        };

        // Callee clicks "Answer"
        document.getElementById('answerBtn').onclick = async () => {
            if (connectedPeers.length === 0 || !pendingOffer) return;
            stopRingTone();
            await initCamera();

            const peer = connectedPeers[0];
            const pc = getOrCreatePC(peer);
            document.getElementById('status').textContent = 'Connecting...';

            try {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: pendingOffer }));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                p2pt.send(peer, { type: 'answer', sdp: pc.localDescription.sdp });

                document.getElementById('answerBtn').style.display = 'none';
                document.getElementById('answerBtn').disabled = true;
                document.getElementById('hangupBtn').disabled = false;
            } catch (err) {
                log('Answer error: ' + err);
            }
        };

        document.getElementById('hangupBtn').onclick = () => {
            hangupCall(true);
        };

        p2pt.start();
    </script>
</body>

</html>
