<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>P2PT Video Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #eee;
            padding: 20px;
        }

        .video-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        video {
            width: 320px;
            height: 240px;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
        }

        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <h1>P2PT Video Test</h1>
    <p id="status">Starting...</p>
    <button id="sendBtn" disabled>Send Hello / Call</button>

    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <pre id="log"></pre>

    <script src="https://cdn.jsdelivr.net/npm/p2pt@1.6.2/dist/p2pt.iife.js"></script>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += msg + '\n';
            console.log(msg);
            el.scrollTop = el.scrollHeight;
        }
    const params = new URLSearchParams(window.location.search);
        const trackersAnnounceURLs = ['wss://tracker2-c3c2b7aba721.herokuapp.com/'];
    const identifier = params.get('room') || 'fallback-room-' + Math.random().toString(36).slice(2, 9);        
    
    const connectedPeers = [];

        let localStream = null;
        let peerConnection = null;

        const rtcConfig = { iceServers: [
                    { urls: "stun:stun.relay.metered.ca:80" },
                    { urls: "stun:stun.services.mozilla.com:3478" },
                    { urls: "stun:stun.nextcloud.com:443" },
                    { urls: "stun:stun.cloudflare.com:3478" },
                    { urls: "turn:standard.relay.metered.ca:80", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                    { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                    { urls: "turn:standard.relay.metered.ca:443", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                    { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "fe67734f65cabae0c1f0bf61", credential: "AY3FDMwL9QjEIZ2R" },
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" },
                    { urls: "stun:global.stun.twilio.com:3478" }
                ] };

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                log('Local camera acquired.');
            } catch (err) {
                log('Camera error: ' + err.message);
            }
        }

        function getOrCreatePC(peer) {
            if (peerConnection) return peerConnection;
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                log('SUCCESS: Received remote video track!');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    p2pt.send(peer, { type: 'ice', candidate: event.candidate });
                    log('Sent ICE candidate.');
                }
            };

            peerConnection.onconnectionstatechange = () => {
                log('PC state: ' + peerConnection.connectionState);
            };

            return peerConnection;
        }

        // Decode a p2pt payload (Uint8Array with a 1-byte header, or string) into an object.
   
        function decodePayload(raw) {
                let text;
                try {
                    text = typeof raw === 'string' ? raw : new TextDecoder().decode(raw);
                } catch (e) { log('Decode failed: ' + e.message); return null; }

                log('RAW: ' + text.substring(0, 120));
                const i = text.indexOf('{');
                if (i === -1) { log('No { in payload'); return null; }

                let outer;
                try { outer = JSON.parse(text.substring(i)); }
                catch (e) { log('Outer parse failed: ' + e.message); return null; }

                // p2pt wraps payloads as { id, msg }, where msg is a JSON string
                if (outer && typeof outer.msg === 'string') {
                    try { return JSON.parse(outer.msg); }
                    catch (e) { log('Inner parse failed: ' + e.message); return null; }
                }

                // Fallback: some p2pt versions deliver the object directly
                return outer;
            }
        const p2pt = new P2PT(trackersAnnounceURLs, identifier);

        p2pt.on('peerconnect', (peer) => {
            document.getElementById('status').textContent = 'Peer connected!';
            document.getElementById('sendBtn').disabled = false;
            log(`Peer connected: ${peer.id}`);
            connectedPeers.push(peer);

            peer.on('data', async (raw) => {
                const data = decodePayload(raw);
                if (!data) return;
                log(`Received data type: ${data.type}`);

                const pc = getOrCreatePC(peer);

                if (data.type === 'hello') {
                    log(`Hello text: ${data.text}`);
                }
                else if (data.type === 'offer') {
                    log('Processing incoming offer...');
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    p2pt.send(peer, { type: 'answer', sdp: pc.localDescription.sdp });
                    log('Sent WebRTC answer back.');
                }
                else if (data.type === 'answer') {
                    if (pc.signalingState === 'have-local-offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                        log('WebRTC description set. Handshake complete!');
                    }
                }
                else if (data.type === 'ice') {
                    if (data.candidate) {
                        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                        log('Added remote ICE candidate.');
                    }
                }
            });
        });

        document.getElementById('sendBtn').onclick = async () => {
            if (connectedPeers.length === 0 || !localStream) return;
            const peer = connectedPeers[0];

            const pc = getOrCreatePC(peer);
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                p2pt.send(peer, { type: 'offer', sdp: pc.localDescription.sdp });
                log('Sent WebRTC video offer.');
            } catch (err) {
                log('Offer error: ' + err);
            }
        };

        initCamera();
        p2pt.start();
    </script>
</body>

</html>
